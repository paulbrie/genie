# python3, gcc, gnumake are required for node-pty native compilation (used by the terminal feature).
# Taz private VMs (10.128/24) are now reached via the authenticated bastion SOCKS5 proxy
# (GENIE_TAZ_SOCKS*), so the wireproxy userspace-WireGuard binary is no longer bundled.
# nixpkgsArchive pins nixos-26.05 at a commit whose nodejs_22 is 22.23.4, the
# patched release from the Node.js October 2026 security releases (nixpacks'
# default archive ships an older, vulnerable 22.x).
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]
